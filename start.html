<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriPersona</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050505;
    }

    body {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #acid-bg {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw;
      min-height: 100vh;
      z-index: 0;
      pointer-events: auto;
    }

    #acid-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.16);
      pointer-events: none;
    }

    .box {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, calc(100vw - 32px));
      padding: 38px 34px 34px;
      text-align: center;
      background: rgba(5, 5, 8, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .brand {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1.2px;
    }

    .brand span {
      background: linear-gradient(90deg, #8b5cf6, #c084fc, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 0 0 28px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 14px;
      line-height: 1.55;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      margin-bottom: 24px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.055);
    }

    .tab {
      border: 0;
      border-radius: 8px;
      padding: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.52);
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab.active {
      color: white;
      background: rgba(82, 39, 255, 0.42);
      box-shadow: 0 4px 18px rgba(82, 39, 255, 0.18);
    }

    .form {
      display: none;
      text-align: left;
    }

    .form.active {
      display: block;
      animation: appear 0.22s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-title {
      margin: 0 0 6px;
      text-align: center;
      font-size: 21px;
      font-weight: 600;
    }

    .form-subtitle {
      margin: 0 0 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 9px;
      outline: none;
      background: rgba(0, 0, 0, 0.42);
      color: white;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input::placeholder {
      color: #666;
    }

    .field input:focus {
      border-color: #7c5cff;
      box-shadow: 0 0 0 3px rgba(82, 39, 255, 0.12);
    }

    .submit-btn {
      width: 100%;
      margin-top: 5px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, #5227ff, #7c3aed);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(82, 39, 255, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(82, 39, 255, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    .message {
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #ff8585;
    }

    .footer {
      margin-top: 22px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .box {
        padding: 30px 24px 26px;
      }

      .brand {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div id="acid-bg"></div>

  <main class="box">
    <h1 class="brand">Tri<span>Persona</span></h1>

    <p class="tagline">
      Three personalities. One conversation.<br>
      Choose who you want to talk to.
    </p>

    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">Sign In</button>
      <button class="tab" id="signupTab" type="button">Create Account</button>
    </div>

    <!-- LOGIN -->
    <form class="form active" id="loginForm">
      <h2 class="form-title">Welcome back</h2>
      <p class="form-subtitle">Sign in to continue your conversations.</p>

      <div class="field">
        <label for="loginUsername">Username</label>
        <input
          id="loginUsername"
          type="text"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="submit-btn" id="loginBtn" type="submit">
        Sign In
      </button>

      <div class="message" id="loginMessage"></div>
    </form>

    <!-- SIGNUP -->
    <form class="form" id="signupForm">
      <h2 class="form-title">Create your account</h2>
      <p class="form-subtitle">Your chats will be saved to your account.</p>

      <div class="field">
        <label for="signupUsername">Username</label>
        <input
          id="signupUsername"
          type="text"
          placeholder="Choose a username"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="signupPassword">Password</label>
        <input
          id="signupPassword"
          type="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="signupConfirm">Confirm Password</label>
        <input
          id="signupConfirm"
          type="password"
          placeholder="Enter your password again"
          autocomplete="new-password"
          required
        >
      </div>

      <button class="submit-btn" id="signupBtn" type="submit">
        Create Account
      </button>

      <div class="message" id="signupMessage"></div>
    </form>

    <div class="footer">TriPersona AI</div>
  </main>

  <script type="module">
    import { createAcidSquares } from "/static/acidsquares.js";

    createAcidSquares(document.getElementById("acid-bg"), {
      color1: "#5227FF",
      color2: "#A855F7",
      color3: "#FFFFFF",
      detail: "medium",
      speed: 0.7,
      waveDepth: 1,
      zoom: 1.3,
      density: 10,
      glow: 1,
      exposure: 2700,
      spread: 0.3,
      stepSize: 0.002,
      colorShift: 0,
      contrast: 1,
      brightness: 1,
      opacity: 1,
      mouseInteraction: true,
      mouseStrength: 0.1,
      mouseRadius: 0.35,
      blur: 0,
      grain: true,
      grainIntensity: 0.05
    });

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const loginMessage = document.getElementById("loginMessage");
    const signupMessage = document.getElementById("signupMessage");

    function showLogin() {
      loginTab.classList.add("active");
      signupTab.classList.remove("active");
      loginForm.classList.add("active");
      signupForm.classList.remove("active");
      loginMessage.textContent = "";
      signupMessage.textContent = "";
      document.getElementById("loginUsername").focus();
    }

    function showSignup() {
      signupTab.classList.add("active");
      loginTab.classList.remove("active");
      signupForm.classList.add("active");
      loginForm.classList.remove("active");
      loginMessage.textContent = "";
      signupMessage.textContent = "";
      document.getElementById("signupUsername").focus();
    }

    loginTab.addEventListener("click", showLogin);
    signupTab.addEventListener("click", showSignup);

    async function submitAuth(form, endpoint, button, messageElement, payload) {
      button.disabled = true;
      messageElement.textContent = "";

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          messageElement.textContent =
            data.message || "Something went wrong. Please try again.";
          return false;
        }

        return true;
      } catch (error) {
        console.error("Authentication error:", error);
        messageElement.textContent =
          "Could not connect to the server. Please try again.";
        return false;
      } finally {
        button.disabled = false;
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username =
        document.getElementById("loginUsername").value.trim();
      const password =
        document.getElementById("loginPassword").value;

      const success = await submitAuth(
        loginForm,
        "/login",
        document.getElementById("loginBtn"),
        loginMessage,
        { username, password }
      );

      if (success) {
        window.location.href = "/chatbot";
      }
    });

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username =
        document.getElementById("signupUsername").value.trim();
      const password =
        document.getElementById("signupPassword").value;
      const confirm =
        document.getElementById("signupConfirm").value;

      signupMessage.textContent = "";

      if (password !== confirm) {
        signupMessage.textContent = "Passwords do not match.";
        return;
      }

      if (password.length < 6) {
        signupMessage.textContent =
          "Password must be at least 6 characters.";
        return;
      }

      const success = await submitAuth(
        signupForm,
        "/register",
        document.getElementById("signupBtn"),
        signupMessage,
        { username, password }
      );

      if (success) {
        window.location.href = "/chatbot";
      }
    });
  </script>

</body>
</html>
